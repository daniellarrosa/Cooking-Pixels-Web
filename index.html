<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooking Pixels — Digital Products Studio</title>
  <meta name="description" content="We build digital products that matter. Coming soon." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fafafa;
      overflow: hidden;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 24px;
    }

    /* Logo */
    .logo {
      width: 280px;
      max-width: 80vw;
      opacity: 0;
      animation: fadeIn 1.2s ease-out 0.3s forwards;
    }

    .logo svg {
      width: 100%;
      height: auto;
      fill: #fafafa;
    }

    /* Message */
    .message {
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.2s ease-out 0.8s forwards;
    }

    .message h1 {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fafafa 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .message p {
      font-size: 0.9rem;
      color: #71717a;
      letter-spacing: 0.03em;
    }

    /* Loading bar */
    .loader {
      width: 120px;
      height: 2px;
      background: #27272a;
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1.2s ease-out 1.3s forwards;
    }

    .loader::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #fafafa, #71717a);
      border-radius: 4px;
      animation: slide 1.8s ease-in-out infinite;
    }

    /* Contact */
    .contact {
      opacity: 0;
      animation: fadeIn 1.2s ease-out 1.6s forwards;
    }

    .contact a {
      font-size: 0.8rem;
      color: #52525b;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.3s;
    }

    .contact a:hover {
      color: #fafafa;
    }

    /* Ambient glow */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250,250,250,0.03) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(200%); }
      100% { transform: translateX(-100%); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
  </style>
</head>
